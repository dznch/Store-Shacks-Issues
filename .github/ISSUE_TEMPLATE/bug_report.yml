name: Bug report
description: Something works wrong or looks wrong.
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Find a shack
        2. Open the golem's menu
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: mod_version
    attributes:
      label: Store Shacks version
      placeholder: e.g. 0.1.0
    validations:
      required: true
  - type: input
    id: neoforge_version
    attributes:
      label: NeoForge version
      placeholder: e.g. 21.1.250
    validations:
      required: true
  - type: input
    id: geckolib_version
    attributes:
      label: GeckoLib version
      placeholder: e.g. 4.9.2
  - type: dropdown
    id: environment
    attributes:
      label: Where does it happen?
      options:
        - Singleplayer
        - Multiplayer server
        - Both
        - Not sure
    validations:
      required: true
  - type: textarea
    id: mods
    attributes:
      label: Other mods or modpack
      description: The modpack name, or the other mods you have installed. "None" if it happens with Store Shacks alone.
  - type: input
    id: log
    attributes:
      label: Log
      description: Upload logs/latest.log to https://mclo.gs and paste the link.
  - type: textarea
    id: media
    attributes:
      label: Screenshots or video
      description: Drag images or a short video here, if the problem is visual.

